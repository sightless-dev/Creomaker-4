name: Desktop build (macOS & Windows)

# Builds the lightweight CreoMaker desktop app (.dmg for macOS, .exe setup for Windows),
# launches each package on real runner OS machines, runs the UI self-test
# with screenshots and publishes everything to the "desktop-latest" release.
# The media library (~1.2 GB) is downloaded on demand inside the application.
# Feature branches (claude/**) build and test the same way but only upload workflow artifacts;
# the macOS app is additionally self-tested on several macOS versions (mac-compat).

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'desktop/**'
      - 'public/**'
      - 'src/**'
      - 'server.cjs'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    # Only main publishes to the desktop-latest release; other branches build artifacts only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure desktop-latest pre-release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create desktop-latest --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "CreoMaker Desktop — последняя сборка" \
            --notes "Автоматическая легковесная сборка десктопной версии CreoMaker для macOS и Windows (~150 МБ). Медиабиблиотека хвостов и музыки скачивается по запросу прямо из приложения. Обновления кода приходят через кнопку «Проверить обновления»."

  mac:
    needs: release
    if: ${{ always() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install toolchain
        run: |
          npm install --no-audit --no-fund
          node node_modules/electron/install.js
          node scripts/make-icon.cjs

      - name: Prepare bundle (lightweight, on-demand assets)
        run: node scripts/prepare-bundle.cjs --platform mac --arch ${{ matrix.arch }} --assets none

      - name: Build .dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Self-test packaged app on macOS
        continue-on-error: true
        run: |
          APP="$(ls -d dist/mac*/CreoMaker.app | head -n 1)"
          echo "App: $APP"
          node scripts/run-selftest.cjs "$APP/Contents/MacOS/CreoMaker" || true
          sw_vers > selftest/system.txt
          uname -m >> selftest/system.txt
          codesign -dv --verbose=2 "$APP" > selftest/codesign.txt 2>&1 || true
          codesign --verify --deep --strict --verbose=2 "$APP" >> selftest/codesign.txt 2>&1 || true
          ls -la selftest
          ditto -c -k selftest "selftest-macOS-${{ matrix.arch }}.zip"

      - name: Upload to desktop-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release upload desktop-latest --repo "$GITHUB_REPOSITORY" --clobber dist/*.dmg "selftest-macOS-${{ matrix.arch }}.zip" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CreoMaker-macOS-${{ matrix.arch }}-dmg
          path: desktop/dist/*.dmg

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-macOS-${{ matrix.arch }}
          path: desktop/selftest

      - name: Pack .app for the compatibility matrix
        if: always()
        run: |
          APP="$(ls -d dist/mac*/CreoMaker.app | head -n 1)"
          ditto -c -k --keepParent "$APP" "CreoMaker-app-${{ matrix.arch }}.zip"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CreoMaker-app-${{ matrix.arch }}
          path: desktop/CreoMaker-app-${{ matrix.arch }}.zip
          retention-days: 7

  # The same packaged app, launched and self-tested on every macOS version GitHub offers
  # (Electron 37 supports macOS 11 Big Sur and newer; older runners are no longer available).
  mac-compat:
    needs: mac
    if: ${{ always() && needs.mac.result != 'cancelled' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-26, arch: arm64 }
          - { runner: macos-15-intel, arch: x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: desktop/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: CreoMaker-app-${{ matrix.arch }}
          path: desktop
      - name: Self-test on ${{ matrix.runner }}
        run: |
          ditto -x -k "CreoMaker-app-${{ matrix.arch }}.zip" app
          node scripts/run-selftest.cjs "app/CreoMaker.app/Contents/MacOS/CreoMaker"
      - name: Summary
        if: always()
        run: |
          mkdir -p selftest && sw_vers > selftest/system.txt && uname -m >> selftest/system.txt
          { echo "### ${{ matrix.runner }} · $(sw_vers -productName) $(sw_vers -productVersion) · $(uname -m)"; echo;
            node -e "const r=require('./selftest/report.json');for(const c of r.checks)console.log((c.pass?'✅':'❌')+' '+c.name);console.log('\n**OK = '+r.ok+'**')" 2>/dev/null || echo "❌ no report"; } >> "$GITHUB_STEP_SUMMARY"
          # Same result as annotations, so it is visible in the run overview and through the checks API.
          node -e "
            const os=require('child_process').execSync('sw_vers -productVersion').toString().trim();
            let r; try { r=require('./selftest/report.json'); } catch { console.log('::error title=${{ matrix.runner }} macOS '+os+'::self-test report missing'); process.exit(0); }
            const ok=r.checks.filter(c=>c.pass).length;
            for (const c of r.checks.filter(c=>!c.pass)) console.log('::error title=${{ matrix.runner }} macOS '+os+'::'+c.name+' '+String(c.detail||'').slice(0,200));
            if (r.error) console.log('::error title=${{ matrix.runner }} macOS '+os+'::'+String(r.error).split('\n')[0].slice(0,200));
            console.log('::notice title=${{ matrix.runner }} macOS '+os+' '+process.arch+'::self-test '+ok+'/'+r.checks.length+' passed');
          "
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-compat-${{ matrix.runner }}
          path: desktop/selftest

  windows:
    needs: release
    if: ${{ always() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install toolchain
        run: |
          npm install --no-audit --no-fund
          node node_modules/electron/install.js
          node scripts/make-icon.cjs

      - name: Prepare bundle (lightweight, on-demand assets)
        run: node scripts/prepare-bundle.cjs --platform win --arch x64 --assets none

      - name: Build Setup .exe
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Self-test packaged app on Windows
        continue-on-error: true
        run: |
          node scripts/run-selftest.cjs "dist/win-unpacked/CreoMaker.exe"
          Compress-Archive -Path selftest -DestinationPath "selftest-Windows-x64.zip"

      - name: Upload to desktop-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          ls -la dist
          gh release upload desktop-latest --repo "$GITHUB_REPOSITORY" --clobber dist/*.exe "selftest-Windows-x64.zip" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CreoMaker-Windows-Setup-exe
          path: desktop/dist/*.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-Windows-x64
          path: desktop/selftest
