<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>CreoMaker</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; grid-template-rows: 40px 1fr;
    font: 500 12.5px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", sans-serif;
    background: #1c1c1e; color: #e4e4e7; user-select: none; cursor: default;
  }
  .drag { -webkit-app-region: drag; }
  main { display: grid; place-items: center; padding-bottom: 40px; }
  .box { display: grid; justify-items: center; gap: 14px; }
  .logo {
    width: 56px; height: 56px; border-radius: 14px;
    background: linear-gradient(145deg, #f2555a, #c8303a);
    display: grid; place-items: center; color: #fff; font-size: 30px; font-weight: 700;
    box-shadow: 0 10px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.18);
  }
  strong { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .bar { width: 160px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
  .bar i { display: block; width: 35%; height: 100%; background: #e5484d; animation: run 1.2s cubic-bezier(.6,0,.4,1) infinite; }
  @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
  small { color: #8e8e93; font-size: 11.5px; }
</style>
</head>
<body>
  <div class="drag"></div>
  <main>
    <div class="box">
      <div class="logo">C</div>
      <strong>CreoMaker</strong>
      <div class="bar"><i></i></div>
      <small>Запуск локального обработчика…</small>
    </div>
  </main>
</body>
</html>
