<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>CreoMaker Studio</title>
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center;
    font: 500 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    background: #e9edf6; color: #1b2030;
  }
  @media (prefers-color-scheme: dark) { body { background: #07090e; color: #e6e9f2; } }
  .box { display: grid; justify-items: center; gap: 18px; }
  .logo {
    width: 72px; height: 72px; border-radius: 18px;
    background: linear-gradient(135deg, #ff4757, #c72939);
    display: grid; place-items: center; color: #fff; font-size: 44px; font-weight: 800;
    box-shadow: 0 12px 36px rgba(199, 41, 57, .35);
  }
  .bar { width: 180px; height: 4px; border-radius: 4px; background: rgba(127,127,127,.25); overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 4px; background: #ff4757; animation: run 1.1s ease-in-out infinite; }
  @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
  small { opacity: .6; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">C</div>
    <strong>CreoMaker Studio</strong>
    <div class="bar"><i></i></div>
    <small>Запускаем локальный обработчик…</small>
  </div>
</body>
</html>
